<!doctype html>

    <!-- viewport-fit=cover lets the page paint under the iPhone notch/Dynamic Island

    />

    <!-- Add to Home Screen behaves like a native app on iOS and Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Calm Creates" />
    <meta name="format-detection" content="telephone=no" />

    <meta
      name="description"
      content="Create Calmness in a World of Chaos — a 30 day guided journal designed to help you find daily peace."
    />
    <title>Create Calmness — 30 Day Create Calmness Journal</title>

    <!-- Social share card: generated by `npm run social-card` -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Create Calmness — 30 Day Journal" />

      property="og:description"
      content="A 30 day guided journal designed to help you find daily peace — Create Calmness in a World of Chaos."
